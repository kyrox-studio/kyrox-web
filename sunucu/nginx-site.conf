# kyrox.studio için nginx sitesi. sunucu/kur.sh bu şablondan
# /etc/nginx/sites-available/kyrox-studio dosyasını yazar (__ALAN__ ve __PORT__ doldurulur).
# HTTPS bölümlerini certbot ekler; dosya bir kez yazılır, sonra kur.sh üzerine yazmaz.

# Giriş sayfasına kaba kuvvet denemelerini yavaşlatır (IP başına dakikada 10 istek).
limit_req_zone $binary_remote_addr zone=kyrox_web_giris:1m rate=10r/m;

# www → çıplak alan adı
server {
    listen 80;
    listen [::]:80;
    server_name www.__ALAN__;
    # $scheme: certbot HTTPS ekleyince www de doğrudan https://__ALAN__'a gider.
    return 301 $scheme://__ALAN__$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name __ALAN__;

    client_max_body_size 20m;

    # XML-RPC kullanılmıyor (tema da kapatır); istek WordPress'e hiç ulaşmasın.
    location = /xmlrpc.php {
        return 403;
    }

    location = /wp-login.php {
        limit_req zone=kyrox_web_giris burst=5 nodelay;
        include /etc/nginx/kyrox-web-proxy.conf;
    }

    location / {
        include /etc/nginx/kyrox-web-proxy.conf;
    }
}
